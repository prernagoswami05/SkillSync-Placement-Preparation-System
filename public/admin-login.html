<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - SkillSync Placement System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background-color: #f1f5f9; }
    .auth-card { border-color: #cbd5e1; box-shadow: var(--shadow-md); }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-logo" style="background: #0f172a;">A</div>
        <div>
          <div class="brand-title">Skill<span>Sync</span> <span class="badge-tag badge-admin">Admin</span></div>
          <div class="brand-subtitle">Placement Administration Portal</div>
        </div>
      </div>

      <div class="alert alert-warning" style="margin-bottom: 1.25rem;">
        <strong>Restricted Access:</strong> Exclusively for authorized faculty and placement coordinators. Non-admin student accounts are rejected.
      </div>

      <div id="alert-box" style="display: none;" class="alert alert-error"></div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="email">Administrator Email</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. admin@skillsync.edu" required autofocus>
        </div>

        <div class="form-group">
          <div class="input-password-row">
            <label class="form-label" for="password">Administrator Password</label>
            <button type="button" id="toggle-pwd" class="toggle-pwd-btn">Show</button>
          </div>
          <input type="password" id="password" class="form-control" placeholder="Enter administrator password" required>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="background: #0f172a; margin-top: 1rem;">
          <span>Authorize Administrator Access</span> &rarr;
        </button>
      </form>

      <!-- Auto-fill Demo Admin -->
      <div style="margin-top: 1rem; padding: 0.625rem 0.875rem; background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 0.75rem; color: var(--text-sub);">
          <strong>Default Admin:</strong> <span style="font-family: var(--font-mono); font-size: 0.7rem;">admin@skillsync.edu</span>
        </div>
        <button type="button" id="demo-admin-btn" class="btn btn-outline btn-sm" style="padding: 0.25rem 0.5rem; font-size: 0.6875rem;">Auto-fill</button>
      </div>

      <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); text-align: center;">
        <p style="font-size: 0.8125rem;">
          <a href="/login.html" style="font-weight: 700;">&larr; Return to Student Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="/js/admin-login-page.js"></script>
</body>
</html>
