<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - SkillSync Placement Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="toast-container"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-logo">S</div>
        <div>
          <div class="brand-title">Skill<span>Sync</span></div>
          <div class="brand-subtitle">Placement Preparation Platform</div>
        </div>
      </div>

      <h2>Student Account Registration</h2>
      <p class="auth-desc">Create your personalized preparation account to track diagnostic scores, company patterns, and roadmaps.</p>

      <div id="alert-box" style="display: none;" class="alert alert-error"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name *</label>
          <input type="text" id="name" class="form-control" placeholder="e.g. Priya Sharma" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address *</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. priya.sharma@college.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Target Placement Role *</label>
          <select id="role" class="form-control">
            <option value="Software Engineer">Software Engineer</option>
            <option value="Data Analyst">Data Analyst</option>
            <option value="Web Developer">Web Developer</option>
            <option value="System Engineer">System Engineer</option>
            <option value="Full Stack Developer">Full Stack Developer</option>
          </select>
        </div>

        <div class="form-group">
          <div class="input-password-row">
            <label class="form-label" for="password">Password *</label>
            <button type="button" id="toggle-pwd" class="toggle-pwd-btn">Show</button>
          </div>
          <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters with letters & numbers" required>
          
          <!-- Password strength bar -->
          <div class="strength-bar-container">
            <div id="bar-1" class="strength-bar"></div>
            <div id="bar-2" class="strength-bar"></div>
            <div id="bar-3" class="strength-bar"></div>
            <div id="bar-4" class="strength-bar"></div>
          </div>
          <div class="strength-info">
            <span id="strength-text">Strength: Too short</span>
            <span id="strength-req">Needs letter &amp; number</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password *</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter password" required>
          <div id="match-msg" style="font-size: 0.7rem; margin-top: 0.25rem;"></div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="margin-top: 1rem;">
          <span>Complete Registration</span> &rarr;
        </button>
      </form>

      <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); text-align: center;">
        <p style="font-size: 0.8125rem; margin-bottom: 0.75rem;">
          Already have an account? <a href="/login.html" style="font-weight: 700;">Sign In here</a>
        </p>
        <p style="font-size: 0.75rem;">
          <a href="/admin-login.html" style="color: var(--text-muted); font-weight: 600;">&bull; Authorized Admin Login &rarr;</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="/js/register-page.js"></script>
</body>
</html>
